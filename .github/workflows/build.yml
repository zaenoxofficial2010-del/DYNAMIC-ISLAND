name: Create build.yml

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate project root (folder containing gradlew)
        id: find
        run: |
          GRADLEW_PATH=$(find . -maxdepth 4 -name "gradlew" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "No gradlew found anywhere in the repo. Listing repo contents for debugging:"
            find . -maxdepth 3
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found gradlew at: $GRADLEW_PATH"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Make Gradle executable
        run: chmod +x "${{ steps.find.outputs.project_dir }}/gradlew"

      - name: Build APK
        working-directory: ${{ steps.find.outputs.project_dir }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.find.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
